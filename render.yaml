services:
  - type: web
    name: releaseradar
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server && npm ci --prefix client && npm run build --prefix client && npm run build --prefix server && mkdir -p server/public && cp -R client/dist/. server/public/
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: releaseradar
          envVarKey: RENDER_EXTERNAL_URL
      - key: CLIENT_URL
        fromService:
          type: web
          name: releaseradar
          envVarKey: RENDER_EXTERNAL_URL
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: AI_API_KEY
        sync: false
